services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee_observability_app
    ports:
      - "5000:10000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=10000
    volumes:
      - ./EmployeeManagement.Api/logs:/app/logs
    restart: unless-stopped

  splunk:
    image: splunk/splunk:latest
    container_name: splunk_demo
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=SplunkPassword123!
      - SPLUNK_HEC_PORT=8088
    ports:
      - "8000:8000"   # Splunk Web UI
      - "8088:8088"   # HTTP Event Collector (HEC)
      - "9997:9997"   # Splunk Forwarder Port
    volumes:
      - splunk_data:/opt/splunk/var
      - ./EmployeeManagement.Api/logs:/opt/splunk/logs
    restart: unless-stopped

volumes:
  splunk_data:
